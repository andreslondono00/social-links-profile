<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <div class="container">
      <div class="jessica-profile">
        <img
          class="jessica-image"
          src="../assets/images/avatar-jessica.jpeg"
          alt="Jessica Randall"
        />
        <h1 class="jessica-name">Jessica Randall</h1>
        <h2 class="jessica-born">London, United Kingdom</h2>
        <p class="jessica-role">"Front-end developer and avid reader."</p>
      </div>

      <div class="social-links">
        <div class="social-container-one">
          <h3>Github</h3>
        </div>
        <div class="social-container-two">
          <h3>Frontend Mentor</h3>
        </div>
        <div class="social-container-three">
          <h3>LinkedIn</h3>
        </div>
        <div class="social-container-four">
          <h3>Twitter</h3>
        </div>
        <div class="social-container-five">
          <h3>Instagram</h3>
        </div>
      </div>

      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >
        Coded by
        <a href="https://github.com/andreslondono00/social-links-profile-main"
          >Andrés Londoño</a
        >
      </div>
    </div>
  </body>
</html>
